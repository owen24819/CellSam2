# @package _global_
# Multi-dataset training. Use: python train_ctc.py --config-name=sam2.1_ctc_finetune_multi
# (Extends GPU config; for CPU debugging use same command with CPU machine or override as needed.)

defaults:
  - sam2.1_ctc_finetune

# List of dataset roots (separate from single-dataset "dataset" in base config). Omit caps to use all.
multi_datasets:
  - data_dir: ../data/moma
    max_per_epoch: 2500
    max_per_epoch_val: 500
  - data_dir: ../data/2D
    max_per_epoch: 1000
    max_per_epoch_val: 200
  - data_dir: ../data/DynamicNuclearNet
    max_per_epoch: 2500
    max_per_epoch_val: 500
  - data_dir: ../data/MLCI
    max_per_epoch: 1000
    max_per_epoch_val: 200

trainer:
  data:
    train:
      dataset:
        video_dataset:
          _target_: training.dataset.vos_raw_dataset.CTCRawDataset
          train_sources: ${multi_datasets}
          split: train
          num_frames: ${scratch.num_frames}
          file_list_txt: null
          target_size: ${scratch.resolution}
          resize_threshold: ${scratch.resize_threshold}
          training: true
          crop_shift_frac: ${ctc_geometry.crop_shift_frac}
          crop_shift_p: ${ctc_geometry.crop_shift_p}
          random_crop_p: ${ctc_geometry.random_crop_p}
          zoom_range: ${ctc_geometry.zoom_range}
          zoom_p: ${ctc_geometry.zoom_p}
          max_shear_deg: ${ctc_geometry.max_shear_deg}
          shear_p: ${ctc_geometry.shear_p}
          wide_aspect_ratio_min: ${ctc_geometry.wide_aspect_ratio_min}
          wide_aspect_shear_cap: ${ctc_geometry.wide_aspect_shear_cap}
          aniso_scale_range: ${ctc_geometry.aniso_scale_range}
          aniso_p: ${ctc_geometry.aniso_p}
    val:
      dataset:
        video_dataset:
          _target_: training.dataset.vos_raw_dataset.CTCRawDataset
          train_sources: ${multi_datasets}
          split: val
          num_frames: ${scratch.num_frames}
          file_list_txt: null
          target_size: ${scratch.resolution}
          resize_threshold: ${scratch.resize_threshold}
          training: false
          crop_shift_frac: 0
          crop_shift_p: 0
          random_crop_p: 0
          zoom_range: [1.0, 1.0]
          zoom_p: 0
          max_shear_deg: 0
          shear_p: 0
          aniso_p: 0
