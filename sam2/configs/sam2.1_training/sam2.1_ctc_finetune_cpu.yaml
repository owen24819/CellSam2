# @package _global_
# CPU / debug variant: extends sam2.1_ctc_finetune with smaller objects, fewer workers, no AMP, CPU accelerator.

defaults:
  - sam2.1_ctc_finetune

# Scratch overrides for CPU / lighter runs
scratch:
  num_train_workers: 0
  num_frames: 2
  max_num_objects: 12
  max_num_bkgd_objects: 4
  num_epochs: 20

# Trainer: CPU and debug viz off
trainer:
  accelerator: cpu
  debug_viz: false
  optim:
    amp:
      enabled: false
      amp_dtype: bfloat16
  distributed:
    backend: file
    find_unused_parameters: false

launcher:
  gpus_per_node: 0
